{background:#f9e5e5}.task.done{opacity:.45}.task.done .taskname{text-decoration:line-through}.taskname{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.task small{font-size:10px;color:#777}.task button{border:0;background:transparent;font-size:16px;padding:0 2px}.now{position:absolute;left:78px;right:0;border-top:2px solid #222;z-index:5;pointer-events:none}.now:before{content:'';position:absolute;width:8px;height:8px;border-radius:50%;background:#222;top:-5px;left:-4px}.now-label{position:absolute;right:0;top:-17px;font-size:10px;background:#fafafa;padding:1px 3px}.empty{padding:40px 0;color:#999;text-align:center}.floating{position:fixed;bottom:24px;right:max(20px,calc((100vw - 880px)/2));background:#222;color:white;border:0;border-radius:30px;padding:14px 22px;box-shadow:0 6px 22px #0002;z-index:10}.panel{border:1px solid #eee;background:white;border-radius:14px;padding:17px;margin:12px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.stack{display:grid;gap:12px}.field{display:grid;gap:6px;font-size:12px;color:#666}.field input,.field select{width:100%;padding:11px;border:1px solid #ddd;border-radius:9px;color:#222;background:white;font-size:15px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.overlay{position:fixed;inset:0;background:#0006;display:flex;align-items:flex-end;justify-content:center;z-index:20}.modal{background:#fff;width:min(100%,530px);max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding:22px}.modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.colorpick{display:flex;gap:8px}.colorpick button{width:38px;height:38px;border:1px solid #ddd;background:white;border-radius:10px;font-size:22px}.colorpick .chosen{border:2px solid #222}.chip{border:1px solid #ddd;border-radius:20px;background:#fff;padding:7px 11px;font-size:12px}.chips{display:flex;gap:6px;flex-wrap:wrap}.recipe-item{display:flex;gap:10px;align-items:center;padding:9px /* TASK v1.6 — cobalt blue accent and five task highlight colors */
:root{--mustard:#2856C8;--mustard-deep:#2146A3;--mustard-soft:#EAF0FF;--ink:#202636;--paper:#FAFBFE;--line:#E4E9F2;color:var(--ink);background:var(--paper)}
body{background:var(--paper)}
header{padding-bottom:18px;border-bottom:1px solid var(--line);gap:14px}
h1{letter-spacing:.11em;font-size:30px;line-height:1.1}
header .sub{color:var(--mustard-deep);font-weight:650;letter-spacing:.025em;margin-top:6px}
h2{letter-spacing:.015em}
.nav{background:#EEF2F9;border:1px solid #E0E7F2;border-radius:13px;gap:3px}
.nav button{font-weight:650;color:#68748A;transition:background .16s,color .16s,box-shadow .16s}
.nav button:hover{background:#EAF0FF;color:var(--ink)}
.nav .active{background:var(--mustard);color:#FFFFFF;box-shadow:0 2px 5px #2856C82A}
.btn{border-color:#DCE4F0;background:#FFFFFF;transition:background .15s,border-color .15s,transform .15s}
.btn:hover{background:var(--mustard-soft);border-color:#A5B9EA}
.btn:active,.floating:active{transform:translateY(1px)}
.btn.primary,.primary{background:var(--mustard);border-color:var(--mustard);color:#FFFFFF;font-weight:750}
.btn.primary:hover,.primary:hover{background:#3566DF;border-color:#3566DF}
.floating{background:var(--mustard);color:#FFFFFF;font-weight:800;box-shadow:0 8px 24px #2856C845;border:1px solid #204AB4;transition:transform .15s,background .15s}
.floating:hover{background:#3566DF;transform:translateY(-2px)}
.panel{border-color:var(--line);box-shadow:0 4px 18px #243F700A}
.week{background:#F0F3FA;padding:5px;border-radius:15px}
.day{transition:background .15s}
.day:hover{background:#EAF0FF}
.day.active{background:var(--mustard-soft);box-shadow:inset 0 0 0 1px #B5C7F1}
.day.active small{color:#2146A3;font-weight:750}
.day.active .dot{background:var(--mustard-deep)}
.stats{border-bottom-color:var(--line)}
.stats strong{color:var(--mustard-deep);font-variant-numeric:tabular-nums}
.lane{border-top-color:#E8EDF5}
.task{border-left:3px solid #AAB4C4;background:#EDF0F5}
.task.red{background:#F9E5E5;border-left-color:#C94F4F}
.task.blue{background:#E3ECFF;border-left-color:#2856C8}
.task.green{background:#E1F3E9;border-left-color:#288660}
.task.yellow{background:#FFF3D5;border-left-color:#D29A16}
.colorpick button{display:flex;align-items:center;justify-content:center;flex:0 0 38px}
.colorpick .chosen{box-shadow:0 0 0 2px #2856C830}
@media(max-width:500px){.colorpick{gap:5px}.colorpick button{flex-basis:36px;width:36px;height:36px}}
.task.done{opacity:.5}
.now{border-top-color:var(--mustard-deep)}
.now:before{background:var(--mustard-deep)}
.now-label{background:var(--paper);color:var(--mustard-deep);font-weight:800}
.calendar-cell{background:#F5F7FC;border:1px solid #E7ECF5;transition:background .15s,border-color .15s}
.calendar-cell:hover{background:var(--mustard-soft);border-color:#AFC3F2}
.calendar-cell.is-selected{background:var(--mustard-soft);border-color:var(--mustard);font-weight:750}
.calendar-cell.is-today span{color:var(--mustard-deep)}
.calendar-dot{background:var(--mustard-deep)}
.field input:focus,.field select:focus{outline:2px solid #4776E8;outline-offset:1px;border-color:#4776E8}
.colorpick .chosen{border-color:var(--mustard-deep);background:var(--mustard-soft)}
.chip:hover{border-color:var(--mustard);background:var(--mustard-soft)}
::selection{background:#BED0FA;color:#182E66}
@media(max-width:500px){header{align-items:flex-start;flex-wrap:wrap;margin-bottom:18px}.nav{width:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}.nav button{padding:10px 4px;font-size:13px}.floating{bottom:18px;right:16px}}
</style></head><body><div class="app"><header><div><h1>TASK</h1><div class="sub">Make time visible.</div></div><div class="nav"><button data-tab="day" class="active">日</button><button data-tab="calendar">月</button><button data-tab="recipes">レシピ</button><button data-tab="settings">設定</button></div></header><main id="main"></main></div><button class="floating" id="addButton">＋ タスク追加</button><div id="overlay" class="hidden"></div><script>
(()=>{'use strict';const KEY='task_app_v1';const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const initial={tasks:[],saved:[],recipes:[],start:6,end:23};let state;try{state={...initial,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{state={...initial}}let date=today(),tab='day',monthMode=false;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{alert('保存できませんでした。ブラウザの保存容量を確認してください。')}};const id=()=>globalThis.crypto?.randomUUID?.()||String(Date.now())+Math.random();const minutes=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};const fmt=n=>`${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;const shift=(d,n)=>{let x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};const nice=d=>new Date(d+'T12:00:00').toLocaleDateString('ja-JP',{month:'long',day:'numeric',weekday:'long'});const overlap=(a,b)=>minutes(a.start)<minutes(b.end)&&minutes(b.start)<minutes(a.end);const timeOptions=()=>Array.from({length:24},(_,i)=>`<option value="${i}">${String(i).padStart(2,'0')}:00</option>`).join('');function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#addButton').classList.toggle('hidden',tab!=='day');if(tab==='day')renderDay();else if(tab==='calendar')renderCalendar();else if(tab==='recipes')renderRecipes();else renderSettings()}
function renderCalendar(){
 const first=new Date(date+'T12:00:00');first.setDate(1);
 const year=first.getFullYear(),month=first.getMonth(),offset=first.getDay();
 const daysInMonth=new Date(year,month+1,0).getDate();

 const value=`${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
 const tasks=state.tasks.filter(t=>t.date===value),count=tasks.length;
 return `<button class="calendar-cell ${value===today()?'is-today':''} ${value===date?'is-selected':''}" data-calendar-date="${value}" aria-label="${month+1}月${day}日、タスク${count}件"><span>${day}</span>${count?'<i class="calendar-dot"></i>':'<i class="calendar-dot invisible"></i>'}</button>`}).join('');
 $('#main').innerHTML=`<div class="toolbar"><div><h2>カレンダー</h2><div class="muted">日付を選んでタスクを確認・管理</div></div><button class="btn" id="calendarToday">今月</button></div><div class="panel calendar-panel"><div class="calendar-heading"><button class="btn" id="monthPrev" aria-label="前月">‹</button><h2>${title}</h2><button class="btn" id="monthNext" aria-label="翌月">›</button></div><div class="calendar-grid">${weekdays}${cells}</div><p class="note">● はタスクが登録されている日です。日付を押すとその日の時間軸が開きます。</p></div>`;
 const move=n=>{const x=new Date(year,month+n,1,12);date=`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-01`;render()};
 $('#monthPrev').onclick=()=>move(-1);$('#monthNext').onclick=()=>move(1);
 $('#calendarToday').onclick=()=>{date=today();render()};
 document.querySelectorAll('[data-calendar-date]').forEach(b=>b.onclick=()=>{date=b.dataset.calendarDate;tab='day';render()});
}
function renderDay(){let t=state.tasks.filter(x=>x.date===date),done=t.filter(x=>x.done).length;let d=new Date(date+'T12:00:00'),dow=d.getDay(),base=shift(date,-dow),days=Array.from({length:7},(_,i)=>shift(base,i));let top=state.start*60,bottom=state.end*60,scale=.9;let entries=t.filter(x=>minutes(x.end)>top&&minutes(x.start)<bottom);let daybar=days.map(x=>`<button class="day ${x===date?'active':''} ${state.tasks.some(t=>t.date===x)?'has':''}" data-date="${x}"><small>${'日月火水木金土'[new Date(x+'T12:00:00').getDay()]}</small><b>${Number(x.slice(-2))}</b><i class="dot"></i></button>`).join('');let timeline=`<div class="timeline" style="height:${(bottom-top)*scale}px">${Array.from({length:state.end-state.start+1},(_,i)=>`<div class="slot" style="position:absolute;top:${i*60*scale}px;left:0;right:0;height:${60*scale}px"><div class="time">${fmt((state.start+i)*60)}</div><div class="lane"></div></div>`).join('')}${entries.map(x=>{let a=Math.max(top,minutes(x.start)),b=Math.min(bottom,minutes(x.end));let same=entries.filter(y=>y.id!==x.id&&overlap(x,y));return `<div class="task ${['red','blue','green','yellow'].includes(x.color)?x.color:''} ${x.done?'done':''}" style="top:${(a-top)*scale+2}px;height:${Math.max(24,(b-a)*scale-4)}px;${same.length?'border-left:3px solid #999;':''}" data-edit="${esc(x.id)}"><button data-check="${esc(x.id)}" title="完了を切り替える">${x.done?'☑':'□'}</button><div class="taskname">${esc(x.name)}</div><small>${esc(x.start)}–${esc(x.end)}</small></div>`}).join('')}<div id="nowLine"></div></div>`;$('#main').innerHTML=`<div class="toolbar"><div><h2>${nice(date)}</h2><div class="muted">${date}</div></div><div style="display:flex;gap:6px"><button class="btn" id="prev">‹</button><button class="btn" id="goToday">今日</button><button class="btn" id="next">›</button></div></div><div class="week">${daybar}</div><div class="toolbar"><div class="stats" style="flex:1"><div><strong>${done}/${t.length}</strong><span class="muted"> 完了</span></div><span class="muted">空き ${freeMinutes(t)} </span></div><button class="btn" id="useRecipe">レシピを使う</button></div>${timeline}<div class="note" style="margin-top:18px">帯をタップすると編集できます。タスクは5色から選べます。選んだ色の淡いハイライトで表示します。</div>`;$('#prev').onclick=()=>{date=shift(date,-1);render()};$('#next').onclick=()=>{date=shift(date,1);render()};$('#goToday').onclick=()=>{date=today();render()};document.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{date=b.dataset.date;render()});document.querySelectorAll('[data-check]').forEach(b=>b.onclick=e=>{e.stopPropagation();let x=state.tasks.find(t=>t.id===b.dataset.check);x.done=!x.done;save();render()});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openTask(b.dataset.edit));$('#useRecipe').onclick=openApply;drawNow()}
function freeMinutes(tasks){let ranges=tasks.map(t=>[Math.max(state.start*60,minutes(t.start)),Math.min(state.end*60,minutes(t.end))]).filter(([a,b])=>b>a).sort((a,b)=>a[0]-b[0]),busy=0,end=state.start*60;for(let [a,b] of ranges){busy+=Math.max(0,b-Math.max(a,end));end=Math.max(end,b)}let n=(state.end-state.start)*60-busy;return `${Math.floor(n/60)}時間${n%60?`${n%60}分`:''}`}
function drawNow(){let el=$('#nowLine');if(!el)return;let now=new Date(),min=now.getHours()*60+now.getMinutes();if(date!==today()||min<state.start*60||min>state.end*60){el.innerHTML='';return}el.innerHTML=`<div class="now" style="top:${(min-state.start*60)*.9}px"><span class="now-label">現在 ${fmt(min)}</span></div>`}setInterval(()=>{if(tab==='day')drawNow()},30000);
function showModal(content){$('#overlay').classList.remove('hidden');$('#overlay').innerHTML=`<div class="overlay"><div class="modal">${content}</div></div>`;$('#overlay .overlay').onclick=e=>{if(e.target===e.currentTarget)closeModal()}}function closeModal(){$('#overlay').classList.add('hidden');$('#overlay').innerHTML=''}const closeButton=`<button class="btn" id="cancel">キャンセル</button>`;function bindCancel(){$('#cancel').onclick=closeModal}
function openTask(taskId=null){let existing=state.tasks.find(t=>t.id===taskId),start=existing?.start||'09:00',end=existing?.end||'10:00';showModal(`<div class="stack"><div class="row"><h2>${existing?'タスク編集':'タスク追加'}</h2><span class="muted">${date}</span></div><label class="field">タスク名<input id="taskName" maxlength="100" placeholder="何をする？" value="${esc(existing?.name||'')}"></label><div id="suggestions" class="chips"></div><div class="two"><label class="field">開始<input id="start" type="time" value="${start}"></label><label class="field">終了<input id="end" type="time" value="${end}"></label></div><div class="row"><span class="muted">色（初期設定は黒）</span><div class="colorpick"><button data-color="black" title="黒">●</button><button data-color="red" title="赤" style="color:#c44747">●</button><button data-color="blue" title="青" style="color:#2856C8">●</button><button data-color="green" title="緑" style="color:#288660">●</button><button data-color="yellow" title="黄" style="color:#D29A16">●</button></div></div><label style="font-size:13px"><input type="checkbox" id="remember"> タスク名と時間・色を次回用に保存</label><div class="actions">${existing?'<button class="btn danger" id="deleteTask">削除</button>':''}${closeButton}<button class="btn primary" id="submitTask">保存</button></div></div>`);let color=existing?.color||'black';function paint(){document.querySelectorAll('[data-color]').forEach(b=>b.classList.toggle('chosen',b.dataset.color===color))}document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{color=b.dataset.color;paint()});paint();function suggest(){let query=$('#taskName').value.toLowerCase();$('#suggestions').innerHTML=state.saved.filter(s=>s.name.toLowerCase().includes(query)).slice(0,8).map(s=>`<button class="chip" data-saved="${esc(s.id)}">${esc(s.name)}</button>`).join('');document.querySelectorAll('[data-saved]').forEach(b=>b.onclick=()=>{let s=state.saved.find(x=>x.id===b.dataset.saved);$('#taskName').value=s.name;$('#start').value=s.start;$('#end').value=s.end;color=s.color||'black';paint();suggest()})}$('#taskName').oninput=suggest;suggest();bindCancel();$('#submitTask').onclick=()=>{let name=$('#taskName').value.trim(),a=$('#start').value,b=$('#end').value;if(!name||!a||!b||minutes(a)>=minutes(b)){alert('タスク名と正しい開始・終了時間を入力してください。');return}let obj={id:existing?.id||id(),date:existing?.date||date,name,start:a,end:b,color,done:existing?.done||false};if(existing)state.tasks=state.tasks.map(x=>x.id===existing.id?obj:x);else state.tasks.push(obj);if($('#remember').checked){let found=state.saved.find(x=>x.name===name);if(found)Object.assign(found,{start:a,end:b,color});else state.saved.push({id:id(),name,start:a,end:b,color})}save();closeModal();render()};if(existing)$('#deleteTask').onclick=()=>{if(confirm('このタスクを削除しますか？')){state.tasks=state.tasks.filter(x=>x.id!==existing.id);save();closeModal();render()}}}
function renderRecipes(){$('#main').innerHTML=`<div class="toolbar"><div><h2>ルーティーンレシピ</h2><p class="muted">1日分のタスクを保存して繰り返し使えます。</p></div><button class="btn primary" id="newRecipe">＋ 新規作成</button></div><div class="panel"><button class="btn" id="saveDay">${nice(date)}のタスクをレシピに保存</button></div>${state.recipes.length?state.recipes.map(r=>`<div class="panel"><div class="row"><div><b>${esc(r.name)}</b><div class="muted">${r.items.length}件のタスク</div></div><div style="display:flex;gap:5px;flex-wrap:wrap"><button class="btn" data-r-edit="${esc(r.id)}">編集</button><button class="btn" data-r-use="${esc(r.id)}">適用</button><button class="btn danger" data-r-del="${esc(r.id)}">削除</button></div></div></div>`).join(''):'<div class="empty">レシピはまだありません。</div>'}`;$('#newRecipe').onclick=()=>openRecipe();$('#saveDay').onclick=()=>{let items=state.tasks.filter(t=>t.date===date).map(({name,start,end,color})=>({name,start,end,color}));if(!items.length){alert('この日にはタスクがありません。');return}let name=prompt('レシピ名を入力してください',nice(date)+'のレシピ');if(name?.trim()){state.recipes.push({id:id(),name:name.trim(),items});save();render()}};document.querySelectorAll('[data-r-edit]').forEach(b=>b.onclick=()=>openRecipe(b.dataset.rEdit));document.querySelectorAll('[data-r-use]').forEach(b=>b.onclick=()=>openApply(b.dataset.rUse));document.querySelectorAll('[data-r-del]').forEach(b=>b.onclick=()=>{if(confirm('レシピを削除しますか？適用済みのタスクは残ります。')){state.recipes=state.recipes.filter(r=>r.id!==b.dataset.rDel);save();render()}})}
function openRecipe(recipeId=null){let existing=state.recipes.find(r=>r.id===recipeId),items=(existing?.items||[]).map(x=>({...x})),recipeDraftName=existing?.name||'';function draw(){showModal(`<div class="stack"><h2>${existing?'レシピ編集':'新しいレシピ'}</h2><label class="field">レシピ名<input id="recipeName" maxlength="80" value="${esc(recipeDraftName||existing?.name||'')}"></label><div id="recipeItems">${items.map((x,i)=>`<div class="recipe-item"><small>${esc(x.start)}–${esc(x.end)}</small><span>${esc(x.name)} ${({red:'🔴',blue:'🔵',green:'🟢',yellow:'🟡'})[x.color]||''}</span><button class="btn" data-remove="${i}">×</button></div>`).join('')}</div><h3>タスクを追加</h3><label class="field">タスク名<input id="rName" placeholder="タスク名"></label><div class="two"><label class="field">開始<input type="time" id="rStart" value="09:00"></label><label class="field">終了<input type="time" id="rEnd" value="10:00"></label></div><label class="field">色<select id="rColor"><option value="black">● 黒</option><option value="red">● 赤</option><option value="blue">● 青</option><option value="green">● 緑</option><option value="yellow">● 黄</option></select></label><button class="btn" id="addRItem">＋ レシピにタスク追加</button><div class="actions">${closeButton}<button class="btn primary" id="saveRecipe">レシピを保存</button></div></div>`);let nameInput=$('#recipeName');document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{recipeDraftName=nameInput.value;items.splice(Number(b.dataset.remove),1);draw()});$('#addRItem').onclick=()=>{let name=$('#rName').value.trim(),a=$('#rStart').value,b=$('#rEnd').value,color=$('#rColor').value;if(!name||!a||!b||minutes(a)>=minutes(b)){alert('タスク名と時間を確認してください。');return}recipeDraftName=nameInput.value;items.push({name,start:a,end:b,color});items.sort((a,b)=>a.start.localeCompare(b.start));draw()};$('#saveRecipe').onclick=()=>{let name=nameInput.value.trim();if(!name){alert('レシピ名を入力してください。');return}if(existing){existing.name=name;existing.items=items}else state.recipes.push({id:id(),name,items});save();closeModal();render()};bindCancel()}draw()}
function openApply(recipeId=null){
 if(!state.recipes.length){alert('レシピがありません。「レシピ」から新規作成してください。');tab='recipes';render();return}
 let chosen=state.recipes.some(r=>r.id===recipeId)?recipeId:state.recipes[0].id;
 let destination=date;
 function draw(){
  const r=state.recipes.find(x=>x.id===chosen);
  if(!r)return;
  const existing=state.tasks.filter(x=>x.date===destination);
  const conflicts=r.items.filter(item=>existing.some(t=>overlap(item,t)));
  showModal(`<div class="stack"><h2>レシピを使用する</h2><label class="field">追加する日付<input type="date" id="applyDate" value="${esc(destination)}"></label><label class="field">レシピ<select id="applySelect">${state.recipes.map(x=>`<option value="${esc(x.id)}" ${x.id===chosen?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><div class="panel">${r.items.length?r.items.map(x=>`<div class="recipe-item"><small>${esc(x.start)}–${esc(x.end)}</small><span>${esc(x.name)}</span></div>`).join(''):'<p class="note">このレシピにはタスクがありません。</p>'}</div><p class="note">選択した日の既存タスクは消さずに追加します。</p>${conflicts.length?`<p style="color:#aa4b30;font-size:13px">時間が重なるタスクが${conflicts.length}件あります。追加時に確認します。</p>`:''}<div class="actions">${closeButton}<button type="button" class="btn primary" id="applyNow" ${r.items.length?'':'disabled'}>このレシピを使用する（${r.items.length}件）</button></div></div>`);
  $('#applySelect').addEventListener('change',e=>{chosen=e.target.value;destination=$('#applyDate').value;draw()});
  $('#applyDate').addEventListener('change',e=>{destination=e.target.value;draw()});
  $('#applyNow').addEventListener('click',()=>{
   destination=$('#applyDate').value;
   if(!/^\d{4}-\d{2}-\d{2}$/.test(destination)){alert('正しい日付を選択してください。');return}
   const current=state.tasks.filter(x=>x.date===destination);
   const collisions=r.items.filter(x=>current.some(t=>overlap(x,t)));
   const duplicate=r.items.some(x=>current.some(t=>t.name===x.name&&t.start===x.start&&t.end===x.end));
   if((collisions.length||duplicate)&&!confirm(`時間が重なるタスク ${collisions.length}件${duplicate?'、同じタスクも登録済み':''}。既存の予定を残して追加しますか？`))return;
   state.tasks.push(...r.items.map(x=>({id:id(),date:destination,name:x.name,start:x.start,end:x.end,color:x.color||'black',done:false})));
   save();date=destination;tab='day';closeModal();render();
  });
  bindCancel();
 }
 draw();
}
function renderSettings(){$('#main').innerHTML=`<h2>設定</h2><div class="panel stack"><h3>タイムラインの表示時間</h3><div class="two"><label class="field">開始<select id="viewStart">${timeOptions()}</select></label><label class="field">終了<select id="viewEnd">${timeOptions()}<option value="24">24:00</option></select></label></div><button class="btn primary" id="saveSettings">保存</button></div><div class="panel stack"><h3>保存済みタスク</h3>${state.saved.map(s=>`<div class="recipe-item"><span>${esc(s.name)} <small class="muted">${esc(s.start)}–${esc(s.end)}</small></span><button class="btn danger" data-s-del="${esc(s.id)}">削除</button></div>`).join('')||'<p class="note">タスク追加時に「次回用に保存」を選ぶとここに表示されます。</p>'}</div><div class="panel stack"><h3>データのバックアップ</h3><p class="note">データはこのブラウザ内に保存されます。別の端末とは自動同期されません。定期的なバックアップをおすすめします。</p><div class="row"><button class="btn" id="export">JSONを書き出す</button><label class="btn">JSONを読み込む<input type="file" id="import" accept="application/json,.json" hidden></label></div></div>`;$('#viewStart').value=state.start;$('#viewEnd').value=state.end;$('#saveSettings').onclick=()=>{let a=Number($('#viewStart').value),b=Number($('#viewEnd').value);if(a>=b){alert('終了時間は開始時間より後にしてください。');return}state.start=a;state.end=b;save();alert('保存しました')};document.querySelectorAll('[data-s-del]').forEach(b=>b.onclick=()=>{state.saved=state.saved.filter(x=>x.id!==b.dataset.sDel);save();render()});$('#export').onclick=()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='TASK-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('#import').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(!Array.isArray(obj.tasks)||!Array.isArray(obj.saved)||!Array.isArray(obj.recipes))throw Error();if(!confirm('現在のデータをバックアップ内容で置き換えますか？'))return;state={...initial,...obj};save();render()}catch{alert('正しいTASKバックアップファイルではありません。')}}}
document.querySelectorAll('[data-tab]').forEach(button=>{button.addEventListener('click',()=>{tab=button.dataset.tab;render()})});$('#addButton').onclick=()=>openTask();render();})();
</script></body></html>
